services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clocked_off
      POSTGRES_USER: clocked_off
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clocked_off_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clocked_off -d clocked_off"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clocked_off_postgres:
